# Jurigest Enterprise - Nginx
# instalar-servidor.sh reemplaza __DOMINIO_WEB__ y __DOMINIO_API__.
# Certbot agrega después los bloques HTTPS (puerto 443) y la redirección desde HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Web (Blazor Server: necesita WebSockets)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO_WEB__;

    # Documentos de hasta 10 MB más el sobrecosto del formulario.
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# API
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO_API__;

    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
